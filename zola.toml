# The URL the site will be built for
base_url = "https://kootenaykoons.com"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

theme = "vonge"
generate_feeds = true

taxonomies = [
    { name = "tags", feed = true},
]

title = "Kootenay Koons"
author = "Kootenay Koons"

[markdown]

[extra]
logo_image = "/images/kootenaykoonslogo.svg"
social_media_share_image = "/images/placeholder.jpg"
author_image = '/images/placeholder.jpg'

social_icons = [    
    { url = "$BASE_URL/atom.xml", icon = "RSS" }
]

navigation = [
    { url = "$BASE_URL", title = "Home" },
    { url = "$BASE_URL/king-and-queen", title = "The King and Queen" },
    { url = "$BASE_URL/kittens", title = "Current Kittens" },
    { url = "$BASE_URL/litters", title = "Past Litters" },    
    { url = "$BASE_URL/posts", title = "Blog" },
    { url = "$BASE_URL/story", title = "Our Story" }
]

[extra.footer]
menu = [
    { url = "$BASE_URL", title = "Home" },
    { url = "$BASE_URL/litters/", title = "Current Kittens" },
    { url = "$BASE_URL/about/", title = "Our Story" },
    { url = "$BASE_URL/posts/", title = "Blog" },
]

[[extra.content_blocks]]
block = "hero"
title = "Hi there, we're Kootenay Koons. "
description_html = "We're a small family breeding homestead nested in the mountains above <strong>Nelson, BC</strong> in the beautiful Kootenays."
image = "/images/placeholder.jpg"
image_alt = "Kootenay Koons"
cta_button_link = "mailto:flavie@hey.com?subject=Kootenay%20Koons"
cta_button = "Get in touch"
works_button_link = "#kittens"
works_button = "See current kittens"

